#-----------------------------------------------------------------------
# This yaml file is used to configure continuous intergration for
# RubricApp.
#
# Date last modified: Thu May 28 01:32:57 PM CDT 2026
#-----------------------------------------------------------------------
name: Rubric App Continuous Integration

# Triggers on pull request to master.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  setup_envs:
    runs-on: ubuntu-latest
    outputs:
      mysql_user: ${{ steps.export-mysql.outputs.mysql_user }}
      mysql_password: ${{ steps.export-mysql.outputs.mysql_password }}
      mysql_database: ${{ steps.export-mysql.outputs.mysql_database }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Cache enviroment
        id: cache-env
        uses: actions/cache@v5
        with:
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Generate Envs
        if: steps.cache-env.outputs.cache-hit != 'true'
        working-directory: Scripts/
        run: python3 quickCreateEnvs.py
      
      - name: Export MySQL envs
        id: export-mysql
        run: |
          echo "mysql_user=$(grep MYSQL_USER BackEndFlask/.env | cut -d '=' -f2)" >> $GITHUB_OUTPUT
          echo "mysql_password=$(grep MYSQL_PASSWORD BackEndFlask/.env | cut -d '=' -f2)" >> $GITHUB_OUTPUT
          echo "mysql_database=$(grep MYSQL_DATABASE BackEndFlask/.env | cut -d '=' -f2)" >> $GITHUB_OUTPUT


  install_frontEnd_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      - name: Install dependencies
        working-directory: FrontEndReact/
        run: npm ci


  lint_frontend:
    runs-on: ubuntu-latest
    needs: install_frontEnd_dependencies
    steps: 
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      
      - name: Install linter
        working-directory: FrontEndReact/
        run: npm ci

      - name: ESLint FrontEnd
        working-directory: FrontEndReact/
        run: npx eslint --max-warnings=0 .


  install_backend_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt


  run_Jest_tests:
    runs-on: ubuntu-latest
    needs: 
      - install_backend_dependencies
      - lint_frontend
      - setup_envs
    env:
      MYSQL_USER: ${{ needs.setup_envs.outputs.mysql_user }}
      MYSQL_PASSWORD: ${{ needs.setup_envs.outputs.mysql_password }}
      MYSQL_DATABASE: ${{ needs.setup_envs.outputs.mysql_database }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Restore envs
        uses: actions/cache@v5
        with: 
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

      - name: Stub systemctl to avoid errors
        run: |
          echo -e '#!/bin/bash\necho "active"' | sudo tee /usr/bin/systemctl > /dev/null
          sudo chmod +x /usr/bin/systemctl

      - name: Install Redis server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      
      - name: Start Redis manually
        run: |
          sudo redis-server --daemonize yes

      - name: Start backend
        working-directory: BackEndFlask/
        run: |
          python3 setupEnv.py -ds &
          bash ../.github/workflows/wait_for_port.sh

      - name: Setup Nodejs 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: FrontEndReact/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('FrontEndReact/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: FrontEndReact/
        run: npm ci

      - name: Cache Jest
        uses: actions/cache@v5
        with:
          path: /tmp/jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('FrontEndReact/package-lock.json') }}

      - name: Run Jest tests
        working-directory: FrontEndReact/
        run: npm test -- --all --cacheDirectory /tmp/jest-cache
        env:
          REACT_APP_API_URL: "http://127.0.0.1:5000/api"


  run_pytests:
    runs-on: ubuntu-latest
    needs:
      - install_backend_dependencies
      - setup_envs
    env:
      MYSQL_USER: ${{ needs.setup_envs.outputs.mysql_user }}
      MYSQL_PASSWORD: ${{ needs.setup_envs.outputs.mysql_password }}
      MYSQL_DATABASE: ${{ needs.setup_envs.outputs.mysql_database }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

      - name: Restore envs
        uses: actions/cache@v5
        with: 
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Stub systemctl to avoid errors
        run: |
          echo -e '#!/bin/bash\necho "active"' | sudo tee /usr/bin/systemctl > /dev/null
          sudo chmod +x /usr/bin/systemctl

      - name: Install Redis server
        run: sudo apt-get install -y redis-server
      
      - name: Start Redis manually
        run: |
          sudo redis-server --daemonize yes

      - name: Add BackEndFlask to PYTHONPATH
        working-directory: BackEndFlask/
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Install pytest-xdist
        run: pip install pytest-xdist

      - name: Run unit tests
        working-directory: BackEndFlask/
        env:
          RUBRICAPP_RUNNING_LOCALLY: "0"
          TESTING_MODE: "1"
        run: pytest Tests/unit -n auto -vv --disable-warnings

      - name: Run integration tests
        working-directory: BackEndFlask/
        env:
          RUBRICAPP_RUNNING_LOCALLY: "0"
          TESTING_MODE: "1"
        run: pytest Tests/integration -vv --disable-warnings



