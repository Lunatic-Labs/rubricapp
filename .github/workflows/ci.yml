#-----------------------------------------------------------------------
# This yaml file is used to configure continuous intergration for
# RubricApp.
#
# Date last modified: Thu May 28 01:32:57 PM CDT 2026
#-----------------------------------------------------------------------
name: Rubric App Continuous Integration

# Triggers on pull request to master.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  setup_envs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Cache enviroment
        id: cache-env
        uses: actions/cache@v5
        with:
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Generate Envs
        if: steps.cache-env.outputs.cache-hit != 'true'
        working-directory: Scripts/
        run: python3 quickCreateEnvs.py

  install_frontEnd_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      - name: Install dependencies
        working-directory: FrontEndReact/
        run: npm ci

  lint_frontend:
    runs-on: ubuntu-latest
    needs: install_frontEnd_dependencies
    steps: 
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      
      - name: Install linter
        working-directory: FrontEndReact/
        run: npm ci

      - name: ESLint FrontEnd
        working-directory: FrontEndReact/
        run: npx eslint --max-warnings=0 .

  install_backend_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

  start_backend:
    runs-on: ubuntu-latest
    needs:
      - setup_envs
      - install_backend_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore envs
        uses: actions/cache@v5
        with: 
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

      - name: Install MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Configure MySQL
        run: |
          sudo mysql --user=root <<EOF
          CREATE DATABASE rubricapp;
          CREATE USER 'rubric'@'localhost' IDENTIFIED BY 'password';
          GRANT ALL PRIVILEGES ON rubricapp.* TO 'rubric'@'localhost';
          FLUSH PRIVILEGES;
          EOF

      - name: Install Redis
        run: sudo apt-get install -y redis-server

      - name: Start Redis
        run: sudo systemctl start redis-server

      - name: Start Redis limiter
        run: sudo redis-server --port 6380 --daemonize yes

      - name: Start backend
        working-directory: BackEndFlask/
        run: |
          python3 setupEnv.py -ds &
          bash ../.github/workflows/wait_for_port.sh

  validate_frontEnd_works_with_backend:
    runs-on: ubuntu-latest
    needs: 
      - start_backend
      - lint_frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Restore envs
        uses: actions/cache@v5
        with: 
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

      - name: Install MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server

      - name: Start MySQL
        run: sudo systemctl start mysql

      - name: Configure MySQL
        run: |
          sudo mysql --user=root <<EOF
          CREATE DATABASE rubricapp;
          CREATE USER 'rubric'@'localhost' IDENTIFIED BY 'password';
          GRANT ALL PRIVILEGES ON rubricapp.* TO 'rubric'@'localhost';
          FLUSH PRIVILEGES;
          EOF

      - name: Install Redis
        run: sudo apt-get install -y redis-server

      - name: Start Redis
        run: sudo systemctl start redis-server

      - name: Start Redis limiter
        run: sudo redis-server --port 6380 --daemonize yes

      - name: Start backend
        working-directory: BackEndFlask/
        run: |
          python3 setupEnv.py -ds &
          bash ../.github/workflows/wait_for_port.sh

      - name: Setup Nodejs 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: FrontEndReact/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('FrontEndReact/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: FrontEndReact/
        run: npm ci

      - name: Cache Jest
        uses: actions/cache@v5
        with:
          path: /tmp/jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('FrontEndReact/package-lock.json') }}

      - name: Run Jest tests
        working-directory: FrontEndReact/
        run: npm test -- --all --cacheDirectory /tmp/jest-cache
        env:
          REACT_APP_API_URL: "http://127.0.0.1:5050/api"

