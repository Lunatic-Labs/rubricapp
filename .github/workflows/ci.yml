name: Rubric App Continuous Integration

# Triggers on pull request to master.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  setup_envs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Cache enviroment
        id: cache-env
        uses: actions/cache@v5
        with:
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Generate Envs
        if: steps.cache-env.outputs.cache-hit != 'true'
        working-directory: Scripts/
        run: python3 quickCreateEnvs.py

  install_frontEnd_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      - name: Install dependencies
        working-directory: FrontEndReact/
        run: npm ci

  lint_frontend:
    runs-on: ubuntu-latest
    needs: install_frontEnd_dependencies
    steps: 
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Nodejs 
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            FrontEndReact/package.json
            FrontEndReact/package-lock.json
      
      - name: Install linter
        working-directly: FrontEndReact/
        run: npm ci

      - name: ESLint FrontEnd
        working-directory: FrontEndReact/
        run: npm run lint

  install_backend_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkoutv6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

  start_backend:
    runs-on: ubuntu-latest
    needs:
      - setup_envs
      - install_backend_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkoutv6

      - name: Restore envs
        uses: actions/cache@v5
        with: 
          path: |
            .env
            BackEndFlask/.env
            FrontEndReact/.env
          key: ${{ hashFiles('Scripts/quickCreateEnvs.py') }}-env

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BackEndFlask/requirements.txt

      - name: Install dependencies
        working-directory: BackEndFlask/
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: BackEndFlask/
        run: |
          python3 setupEnv.py -ds &
          bash ../.github/workflows/wait_for_port.sh

